[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enext-scraper"
version = "0.1.0"
description = "Playwright scraper for enext.ua products with OpenAI Polish descriptions and Excel export."
requires-python = ">=3.11"
dependencies = [
    "openai",
    "openpyxl",
    "playwright",
]

[project.scripts]
enext-scraper = "enext_scraper.cli:main"

